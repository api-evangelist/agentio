access:
  mode: read-only
  scoping: one brand per connection; the brand is chosen during the OAuth consent step
  stated_limits:
  - cannot change anything in the account
  - cannot reach another brand's data
  - cannot act on the user's behalf
  prerequisites:
  - an Agentio account (sign-in happens during connector setup)
  - an MCP client that supports custom connectors (docs name Claude and ChatGPT; any MCP client works
    the same way)
  - availability depends on the customer's Agentio plan, and a workspace admin may control which connectors
    can be added
  management: Settings -> Integrations in the Agentio app lists every connected AI app and when it connected;
    disconnecting takes effect immediately. Each app holds one connection.
authorization:
  scheme: OAuth 2.1 authorization code + PKCE
  challenge: 'anonymous requests return HTTP 401 with WWW-Authenticate: Bearer resource_metadata="https://mcp.agentio.com/.well-known/oauth-protected-resource/mcp"'
  protected_resource_metadata: well-known/agentio-oauth-protected-resource.json
  authorization_server_metadata: well-known/agentio-oauth-authorization-server.json
  scopes:
  - brand-connector:read
  profile: authentication/agentio-authentication.yml
tools:
