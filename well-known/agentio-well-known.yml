source: live probes of every Agentio host (www, app, api, mcp)
note: >-
  Agentio serves no security.txt, no api-catalog and no ai-plugin.json on any host. It DOES
  serve two real machine-readable discovery documents for its hosted MCP server: an RFC 9728
  OAuth 2.0 Protected Resource Metadata document on mcp.agentio.com (advertised in the
  WWW-Authenticate challenge returned by every anonymous request to the MCP endpoint), and the
  matching RFC 8414 OAuth 2.0 Authorization Server Metadata document on api.agentio.com at the
  issuer-suffixed path /.well-known/oauth-authorization-server/o. Both were fetched anonymously.
  Note that mcp.agentio.com answers 401 {"error": "invalid_token"} for every /.well-known/* path
  it does not implement, and www/app/api answer 404 with an HTML body, so the two 200s below are
  the only documents served.
