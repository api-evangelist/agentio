apis:
- name: Agentio Brand Connector (MCP)
  description: 'Agentio''s hosted, remote Model Context Protocol server. A brand adds
    https://mcp.agentio.com/mcp to any MCP client (Claude, ChatGPT, or any other custom-connector
    host), authorizes over OAuth 2.1, and picks one brand to pin the connection to. The
    connector is READ-ONLY: it can read campaigns, creator deals and deliverables, YouTube
    ad performance, and conversion reporting, and can answer questions about how Agentio
    works (metric definitions, workflow behavior). It cannot change account data, act on
    the user''s behalf, or reach another brand''s data. The live tools/list manifest is
    auth-gated — an anonymous JSON-RPC call returns HTTP 401 {"error": "invalid_token"}
    with an RFC 9728 WWW-Authenticate challenge — so tool input schemas require an authenticated
    introspection.'
  humanURL: https://www.agentio.com/connector
  baseURL: https://mcp.agentio.com/mcp
