aid: agentio
name: Agentio
description: 'Agentio is an AI-native platform for creator advertising that connects
  brands with content creators across YouTube, Meta, and beyond. The two-sided platform
  gives brands agentic tooling to build, automate, and scale creator programs — handling
  creator matching and vetting, performance prediction from first-party creator data,
  campaign management, full-funnel measurement, and optimization — while giving creators
  personalized opportunities from top brands without manual negotiation. Founded by
  Arthur Leopold and Jonathan Meyers and based in Brooklyn, New York, Agentio holds
  official API marketing-partner status with closed advertising ecosystems and has
  raised $56M total, including a $40M Series B led by Forerunner at a $340M valuation.
  Agentio operates a private product application (app.agentio.com) and publishes no REST
  OpenAPI, GraphQL schema, or developer portal — but it does run a documented, production
  hosted MCP (Model Context Protocol) server, the Agentio Brand Connector at
  https://mcp.agentio.com/mcp, which lets a brand read its own campaigns, creator deals and
  deliverables, YouTube ad performance, and conversion reporting from any MCP client such as
  Claude or ChatGPT. Access is read-only, scoped to a single brand, and gated by OAuth 2.1
  with PKCE and dynamic client registration.'
